<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code 聊天室</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f4f4f9; }
        #messages { flex: 1; list-style-type: none; margin: 0; padding: 20px; overflow-y: auto; }
        #messages li { padding: 10px 15px; margin-bottom: 10px; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); max-width: 70%; word-wrap: break-word; }
        #messages li strong { color: #007bff; display: block; margin-bottom: 4px; font-size: 0.9em; }
        #form { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
        #username { width: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-right: 8px; }
        #input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-right: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <ul id="messages"></ul>
    <form id="form">
        <input id="username" placeholder="你的暱稱" required />
        <input id="input" autocomplete="off" placeholder="輸入訊息..." required />
        <button type="submit">傳送</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const usernameInput = document.getElementById('username');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value && usernameInput.value) {
                socket.emit('chat message', { user: usernameInput.value, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.innerHTML = `<strong>${escapeHTML(data.user)}</strong>${escapeHTML(data.text)}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
